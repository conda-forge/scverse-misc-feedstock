schema_version: 1

context:
  version: "0.1.9"
  python_min: "3.12"

package:
  name: scverse-misc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scverse-misc/scverse_misc-${{ version }}.tar.gz
  sha256: ee4432204ac8995ac6ce2dcf091f5a21eb5fb344a40abbb354c7407e7e8c0d1b

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-vcs
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - session-info2
    - typing_extensions
  extras:
    datasets:
      - anndata
      - pooch
      - pyyaml
      - tqdm
    logging:
      - pydantic
    rich:
      - rich
    settings:
      - pydantic-settings
      - python-dotenv
    spatialdata:
      - spatialdata
    #sphinx:
    #  - scverse-doc  # not on conda-forge
    #  - pydocstring-rs  # not on conda-forge
    #  - sphinx >=9

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - scverse_misc
      pip_check: true

about:
  summary: Miscellaneous utility code used by scverse packages
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/scverse/scverse-misc
  repository: https://github.com/scverse/scverse-misc
  documentation: https://scverse-misc.readthedocs.io/

extra:
  recipe-maintainers:
    - ilia-kats
    - flying-sheep
    - ilan-gold
    - grst
